---
layout: default
title: Rake Wall Calculator
---

<style>
.calculator { max-width: 720px; }
.calc-section {
  margin-bottom: 1.25rem;
  padding: 0.9rem 1rem;
  border: 1px solid var(--navColour);
  border-radius: 6px;
}
.calc-section h3 {
  margin: 0 0 0.75rem 0;
  font-size: 1rem;
  border-bottom: 1px solid var(--navColour);
  padding-bottom: 0.4rem;
}
.input-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.45rem;
  flex-wrap: wrap;
}
.input-row label.row-label {
  min-width: 190px;
  font-size: 0.88rem;
}
.ft-in { display: flex; align-items: center; gap: 0.3rem; font-size: 0.88rem; }
input[type="number"] {
  width: 54px;
  padding: 0.28rem 0.3rem;
  border: 1px solid var(--navColour);
  border-radius: 4px;
  background: var(--backgroundColour);
  color: inherit;
  font-size: 0.88rem;
  text-align: right;
}
input[type="number"].narrow { width: 44px; }
input[type="number"].wide { width: 70px; }
.radio-group { display: flex; gap: 0.8rem; flex-wrap: wrap; }
.radio-group label {
  display: flex; align-items: center; gap: 0.25rem;
  font-size: 0.88rem; cursor: pointer; min-width: auto;
}
select {
  padding: 0.28rem 0.35rem;
  border: 1px solid var(--navColour);
  border-radius: 4px;
  background: var(--backgroundColour);
  color: inherit;
  font-size: 0.88rem;
}
.btn-calc {
  display: inline-block;
  padding: 0.5rem 1.5rem;
  border: 1px solid var(--navColour);
  border-radius: 4px;
  background: transparent;
  color: inherit;
  font-size: 0.95rem;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--navColour);
  transition: transform 0.05s, box-shadow 0.05s;
  margin-top: 0.5rem;
}
.btn-calc:active { transform: translate(2px,2px); box-shadow: none; }
.btn-sm {
  padding: 0.22rem 0.6rem;
  border: 1px solid var(--navColour);
  border-radius: 4px;
  background: transparent;
  color: inherit;
  font-size: 0.8rem;
  cursor: pointer;
  box-shadow: 1px 1px 0 var(--navColour);
}
.btn-sm:active { transform: translate(1px,1px); box-shadow: none; }
.opening-item {
  border: 1px solid var(--navColour);
  border-radius: 5px;
  padding: 0.7rem 0.8rem;
  margin-bottom: 0.7rem;
}
.opening-hdr {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 0.5rem; font-weight: bold; font-size: 0.88rem;
}
.hidden { display: none; }
.error-msg { color: #c0392b; font-size: 0.85rem; margin: 0.4rem 0; }
#results { display: none; margin-top: 1.5rem; }
.summary-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.15rem 0.75rem;
  font-size: 0.88rem;
  margin-bottom: 0.5rem;
}
.summary-grid dt { font-weight: bold; white-space: nowrap; }
.summary-grid dd { margin: 0; }
.stud-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
  margin-top: 0.5rem;
}
.stud-table th, .stud-table td {
  border: 1px solid var(--navColour);
  padding: 0.25rem 0.45rem;
  text-align: left;
}
.stud-table th { background: var(--navColour); color: var(--backgroundColour); }
.stud-table tr:nth-child(even) td { background: rgba(128,128,128,0.07); }
.stud-table td.pos-col { text-align: right; font-variant-numeric: tabular-nums; }
.stud-table td.len-col { text-align: right; font-variant-numeric: tabular-nums; }
small { opacity: 0.7; }
</style>

<div class="calculator">

  <div class="calc-section">
    <h3>Wall Configuration</h3>

    <div class="input-row">
      <label class="row-label">Wall Type</label>
      <div class="radio-group">
        <label><input type="radio" name="wallType" value="shed" checked> Shed</label>
        <label><input type="radio" name="wallType" value="gable"> Gable</label>
      </div>
    </div>

    <div class="input-row">
      <label class="row-label">Wall Length</label>
      <div class="ft-in">
        <input type="number" id="wallLenFt" min="0" value="12" inputmode="numeric"> ft
        <input type="number" id="wallLenIn" min="0" max="11.9375" step="0.0625" value="0" inputmode="decimal"> in
      </div>
    </div>

    <div class="input-row">
      <label class="row-label">Low-End Height <small>(to top of plate)</small></label>
      <div class="ft-in">
        <input type="number" id="lowHtFt" min="0" value="8" inputmode="numeric"> ft
        <input type="number" id="lowHtIn" min="0" max="11.9375" step="0.0625" value="0" inputmode="decimal"> in
      </div>
    </div>

    <div class="input-row">
      <label class="row-label">Pitch (left side)</label>
      <div class="ft-in">
        <input type="number" id="pitch" min="0.1" step="0.25" value="4" inputmode="decimal"> : 12
      </div>
    </div>

    <div id="gableOptions" class="hidden">
      <div class="input-row" style="margin-top:0.4rem;">
        <label class="row-label">Peak Position</label>
        <div class="radio-group">
          <label><input type="radio" name="peakPos" value="center" checked> Center</label>
          <label><input type="radio" name="peakPos" value="custom"> Custom</label>
        </div>
      </div>
      <div id="peakCustomRow" class="input-row hidden">
        <label class="row-label">Peak from Left End</label>
        <div class="ft-in">
          <input type="number" id="peakFt" min="0" value="6" inputmode="numeric"> ft
          <input type="number" id="peakIn" min="0" max="11.9375" step="0.0625" value="0" inputmode="decimal"> in
        </div>
      </div>
    </div>
  </div>

  <div class="calc-section">
    <h3>Framing</h3>
    <div class="input-row">
      <label class="row-label">Stud Spacing</label>
      <div class="radio-group">
        <label><input type="radio" name="spacing" value="16" checked> 16" OC</label>
        <label><input type="radio" name="spacing" value="24"> 24" OC</label>
      </div>
    </div>
    <div class="input-row">
      <label class="row-label">Top Plate</label>
      <div class="radio-group">
        <label><input type="radio" name="topPlate" value="single"> Single (1½")</label>
        <label><input type="radio" name="topPlate" value="double" checked> Double (3")</label>
      </div>
    </div>
  </div>

  <div class="calc-section">
    <h3>Sheathing Layout</h3>
    <div class="input-row">
      <label class="row-label">Layout End</label>
      <div class="radio-group">
        <label><input type="radio" name="layoutEnd" value="left" checked> Left</label>
        <label><input type="radio" name="layoutEnd" value="right"> Right</label>
      </div>
    </div>
    <div class="input-row">
      <label class="row-label">Sheathing Overhang</label>
      <div class="ft-in">
        <input type="number" id="overhang" min="0" max="47.9375" step="0.0625" value="0" inputmode="decimal"> in
      </div>
    </div>
  </div>

  <div class="calc-section">
    <h3>Openings</h3>
    <div id="openingsList"></div>
    <button class="btn-sm" onclick="addOpening()">+ Add Opening</button>
  </div>

  <div id="errorMsg" class="error-msg"></div>
  <button class="btn-calc" onclick="calculate()">Calculate</button>

  <div id="results">
    <div class="calc-section">
      <h3>Summary</h3>
      <div id="summaryContent"></div>
    </div>
    <div class="calc-section">
      <h3>Wall Preview</h3>
      <div id="svgContent"></div>
    </div>
    <div class="calc-section">
      <h3>Cut List &mdash; <small>centers from <strong id="layoutFromLabel">left</strong> end</small></h3>
      <div id="studListContent"></div>
    </div>
  </div>

</div>

<script>
const BP = 1.5;   // bottom plate thickness
const PLY = 1.5;  // thickness of one top-plate ply, measured square to the plate
const HEADER_DEPTHS = { '2x4': 3.5, '2x6': 5.5, '2x8': 7.25, '2x10': 9.25, '2x12': 11.25 };
let openingCount = 0;

// ── UI helpers ──────────────────────────────────────────────────────────────
function radio(name) {
  return document.querySelector(`input[name="${name}"]:checked`)?.value;
}
function ftInEl(ftId, inId) {
  return (parseFloat(document.getElementById(ftId).value) || 0) * 12
       + (parseFloat(document.getElementById(inId).value) || 0);
}

function toFtIn(totalInches) {
  if (totalInches < 0) return '—';
  const f = Math.floor(totalInches * 16 + 1e-6) / 16;
  const ft = Math.floor(f / 12);
  const rem = f - ft * 12;
  const wi = Math.floor(rem);
  const fn = Math.round((rem - wi) * 16);
  if (fn === 0) return `${ft}' ${wi}"`;
  const g = gcd(fn, 16);
  return `${ft}' ${wi} ${fn/g}/${16/g}"`;
}
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

// ── Wall geometry ────────────────────────────────────────────────────────────
// A "profile" is { f: x => y, breaks: [x...] }: a piecewise-linear line in
// elevation (y up from the subfloor), with the x positions where it changes slope.
const flat = y => ({ f: () => y, breaks: [] });
const sloped = (y0, x0, m) => ({ f: x => y0 + m * (x - x0), breaks: [] });

// Lines (y = a + m·x) along the top of the wall. Shed: one; gable: two.
function roofLines(p) {
  if (p.wallType === 'shed') return [{ a: p.lowHt, m: p.pitch / 12 }];
  return [
    { a: p.lowHt, m: p.pitch / 12 },
    { a: p.lowHt + p.wallLen * p.rightPitch / 12, m: -p.rightPitch / 12 },
  ];
}
// Surface `o` inches below the top of the top plate, measured square to the
// plate. On a slope the plumb (vertical) depth is o / cos θ = o·√(1+m²).
function plateSurface(p, o) {
  const ls = roofLines(p).map(l => ({ a: l.a - o * Math.hypot(1, l.m), m: l.m }));
  const breaks = [];
  if (ls.length === 2) {
    const xi = (ls[1].a - ls[0].a) / (ls[0].m - ls[1].m);
    if (xi > 0 && xi < p.wallLen) breaks.push(xi);
  }
  return { f: x => Math.min(...ls.map(l => l.a + l.m * x)), breaks };
}
function wallHt(x, p) { return plateSurface(p, 0).f(x); }
function slopeAt(x, p) {
  if (p.wallType === 'shed') return p.pitch / 12;
  return x < p.peakX ? p.pitch / 12 : -p.rightPitch / 12;
}

// A framing member spanning xa..xb (plan), between a bottom and a top profile.
function member(type, xa, xb, bot, top, notes = '') {
  const inside = x => x > xa + 1e-6 && x < xb - 1e-6;
  const pts = [xa, ...top.breaks.filter(inside), ...bot.breaks.filter(inside), xb].sort((a, b) => a - b);
  const lens = pts.map(x => top.f(x) - bot.f(x));
  const long = Math.max(...lens), short = Math.min(...lens);
  const topSq = Math.abs(top.f(xa) - top.f(xb)) < 1e-6 && !top.breaks.some(inside);
  const botSq = Math.abs(bot.f(xa) - bot.f(xb)) < 1e-6 && !bot.breaks.some(inside);
  let cut;
  if (top.breaks.some(inside)) cut = 'sq to peak';
  else if (topSq && botSq) cut = '';
  else if (topSq !== botSq) cut = 'sq to long';
  else cut = Math.abs(lens[0] - lens[lens.length - 1]) < 1e-6 ? 'parallel bevels' : 'long to long';
  return { type, x: (xa + xb) / 2, xa, xb, bot, top, pts, length: long, short, cut, notes };
}
const overlaps = (a, b) => a.xa < b.xb - 1e-6 && b.xa < a.xb - 1e-6;

// ── Opening management ───────────────────────────────────────────────────────
function addOpening() {
  openingCount++;
  const id = openingCount;
  const div = document.createElement('div');
  div.className = 'opening-item';
  div.id = `op-${id}`;
  div.innerHTML = `
    <div class="opening-hdr">
      <span>Opening ${id}</span>
      <button class="btn-sm" onclick="removeOpening(${id})">Remove</button>
    </div>
    <div class="input-row">
      <label class="row-label">Type</label>
      <div class="radio-group">
        <label><input type="radio" name="opType${id}" value="window" checked onchange="refreshOpening(${id})"> Window</label>
        <label><input type="radio" name="opType${id}" value="door" onchange="refreshOpening(${id})"> Door</label>
      </div>
    </div>
    <div class="input-row">
      <label class="row-label">Left Edge of RO from Left</label>
      <div class="ft-in">
        <input type="number" id="opX${id}Ft" min="0" value="3" inputmode="numeric"> ft
        <input type="number" id="opX${id}In" min="0" max="11.9375" step="0.0625" value="0" inputmode="decimal"> in
      </div>
    </div>
    <div class="input-row">
      <label class="row-label">RO Width</label>
      <div class="ft-in">
        <input type="number" id="opW${id}Ft" min="0" value="3" inputmode="numeric"> ft
        <input type="number" id="opW${id}In" min="0" max="11.9375" step="0.0625" value="0" inputmode="decimal"> in
      </div>
    </div>
    <div class="input-row">
      <label class="row-label">RO Height <small>(raked: at left edge)</small></label>
      <div class="ft-in">
        <input type="number" id="opH${id}Ft" min="0" value="4" inputmode="numeric"> ft
        <input type="number" id="opH${id}In" min="0" max="11.9375" step="0.0625" value="0" inputmode="decimal"> in
      </div>
    </div>
    <div class="input-row">
      <label class="row-label">Header Size</label>
      <select id="opHdrSz${id}" onchange="refreshOpening(${id})">
        <option value="2x4">2&times;4 (3&frac12;")</option>
        <option value="2x6">2&times;6 (5&frac12;")</option>
        <option value="2x8" selected>2&times;8 (7&frac14;")</option>
        <option value="2x10">2&times;10 (9&frac14;")</option>
        <option value="2x12">2&times;12 (11&frac14;")</option>
        <option value="custom">Custom</option>
      </select>
      <span id="opHdrCustomWrap${id}" class="hidden ft-in">
        <input type="number" class="wide" id="opHdrCustom${id}" min="1" step="0.0625" value="7.25" inputmode="decimal"> in
      </span>
    </div>
    <div class="input-row">
      <label class="row-label">Header Style</label>
      <div class="radio-group">
        <label><input type="radio" name="opHStyle${id}" value="level" checked> Level</label>
        <label><input type="radio" name="opHStyle${id}" value="raked"> Raked</label>
      </div>
    </div>
    <div class="input-row" id="opSillRow${id}">
      <label class="row-label">Sill Height <small>(RO bottom from subfloor)</small></label>
      <div class="ft-in">
        <input type="number" id="opSill${id}Ft" min="0" value="2" inputmode="numeric"> ft
        <input type="number" id="opSill${id}In" min="0" max="11.9375" step="0.0625" value="0" inputmode="decimal"> in
      </div>
    </div>`;
  document.getElementById('openingsList').appendChild(div);
}

function removeOpening(id) {
  document.getElementById(`op-${id}`)?.remove();
}

function refreshOpening(id) {
  const type = document.querySelector(`input[name="opType${id}"]:checked`)?.value;
  document.getElementById(`opSillRow${id}`)?.classList.toggle('hidden', type === 'door');
  const hdrSz = document.getElementById(`opHdrSz${id}`)?.value;
  document.getElementById(`opHdrCustomWrap${id}`)?.classList.toggle('hidden', hdrSz !== 'custom');
}

// Wall type / peak toggles
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('input[name="wallType"]').forEach(r =>
    r.addEventListener('change', () => {
      document.getElementById('gableOptions').classList.toggle('hidden', r.value !== 'gable' || !r.checked);
    })
  );
  document.querySelectorAll('input[name="peakPos"]').forEach(r =>
    r.addEventListener('change', () => {
      document.getElementById('peakCustomRow').classList.toggle('hidden', r.value !== 'custom');
    })
  );
});

// ── SVG wall preview ─────────────────────────────────────────────────────────
function generateWallSVG(members, openings, p) {
  const { wallLen } = p;
  const maxHt = p.wallType === 'shed' ? wallHt(wallLen, p) : wallHt(p.peakX, p);
  const pad = Math.max(3, wallLen * 0.018);
  const vbW = wallLen + pad * 2, vbH = maxHt + pad * 2;
  const tx = `translate(${pad.toFixed(2)},${(pad + maxHt).toFixed(2)}) scale(1,-1)`;
  const e = [];
  const f = n => n.toFixed(3);

  // Polygon between two profiles from xa to xb, including slope breaks
  const band = (cls, xa, xb, bot, top) => {
    const inside = x => x > xa + 1e-6 && x < xb - 1e-6;
    const bx = [xa, ...bot.breaks.filter(inside), xb].sort((a, b) => a - b);
    const tX = [xa, ...top.breaks.filter(inside), xb].sort((a, b) => b - a);
    const pts = [...bx.map(x => `${f(x)},${f(bot.f(x))}`), ...tX.map(x => `${f(x)},${f(top.f(x))}`)];
    return `<polygon class="${cls}" points="${pts.join(' ')}"/>`;
  };

  // Bottom plate — split at door openings so doorways are open
  const doorOps = openings.filter(o => o.type === 'door').sort((a, b) => a.x1 - b.x1);
  let bx = 0;
  for (const d of doorOps) {
    if (d.x1 > bx) e.push(band('ws-plate', bx, d.x1, flat(0), flat(BP)));
    bx = d.x2;
  }
  if (bx < wallLen) e.push(band('ws-plate', bx, wallLen, flat(0), flat(BP)));

  // Top plate, one band per ply (true depth on the slope, mitred at a gable peak)
  const plies = Math.round(p.topPlateThick / PLY);
  for (let k = 0; k < plies; k++)
    e.push(band('ws-plate', 0, wallLen, plateSurface(p, (k + 1) * PLY), plateSurface(p, k * PLY)));

  const cls = { End: 'ws-stud', Regular: 'ws-stud', Peak: 'ws-stud', King: 'ws-king', Jack: 'ws-jack',
                'Cripple↑': 'ws-cripple', 'Cripple↓': 'ws-cripple', Header: 'ws-header', Sill: 'ws-sill' };
  for (const m of members) e.push(band(cls[m.type], m.xa, m.xb, m.bot, m.top));

  // RO dashed outlines
  for (const op of openings) {
    const pts = [[op.x1, op.rob], [op.x2, op.rob], [op.x2, op.hb.f(op.x2)], [op.x1, op.hb.f(op.x1)]];
    e.push(`<polygon class="ws-ro" points="${pts.map(([x, y]) => `${f(x)},${f(y)}`).join(' ')}"/>`);
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${f(vbW)} ${f(vbH)}" style="width:100%;display:block;"><style>
.ws-plate{fill:var(--navColour);opacity:.85;stroke:var(--backgroundColour);stroke-width:.25}
.ws-stud{fill:var(--navColour);opacity:.38}
.ws-king{fill:var(--navColour);opacity:.72}
.ws-jack{fill:var(--navColour);opacity:.5}
.ws-cripple{fill:var(--navColour);opacity:.26}
.ws-header{fill:var(--navColour);opacity:.82}
.ws-sill{fill:var(--navColour);opacity:.55}
.ws-ro{fill:none;stroke:var(--navColour);stroke-width:.6;stroke-dasharray:3 2;opacity:.6}
</style><g transform="${tx}">${e.join('')}</g></svg>`;
}

// ── Main calculation ─────────────────────────────────────────────────────────
function calculate() {
  const errEl = document.getElementById('errorMsg');
  errEl.textContent = '';
  const fail = msg => { errEl.textContent = msg; document.getElementById('results').style.display = 'none'; };

  const wallType = radio('wallType');
  const wallLen  = ftInEl('wallLenFt', 'wallLenIn');
  const lowHt    = ftInEl('lowHtFt', 'lowHtIn');
  const pitch    = parseFloat(document.getElementById('pitch').value) || 0;
  const topPlate = radio('topPlate');
  const topPlateThick = topPlate === 'double' ? 2 * PLY : PLY;
  const studSpacing = parseInt(radio('spacing'));
  const layoutEnd = radio('layoutEnd');
  const overhang  = parseFloat(document.getElementById('overhang').value) || 0;

  if (wallLen <= 0 || lowHt <= 0 || pitch <= 0) return fail('Enter wall length, height, and pitch.');

  let peakX = wallLen / 2;
  let rightPitch = pitch;
  if (wallType === 'gable') {
    if (radio('peakPos') === 'custom') {
      peakX = ftInEl('peakFt', 'peakIn');
      if (peakX <= 0 || peakX >= wallLen) return fail('Peak must be between 0 and wall length.');
    }
    rightPitch = peakX * pitch / (wallLen - peakX);
  }

  const params = { wallType, wallLen, lowHt, pitch, peakX, rightPitch, topPlateThick, studSpacing, layoutEnd, overhang };
  const U = plateSurface(params, topPlateThick); // underside of the top plate
  const BOT = flat(BP);                           // top of the bottom plate

  // Shortest point on the underside of the top plate between xa and xb
  const minUnder = (xa, xb) =>
    Math.min(U.f(xa), U.f(xb), ...U.breaks.filter(x => x > xa && x < xb).map(U.f));
  if (minUnder(0, wallLen) - BP < 1) return fail('Wall is too short for the plates.');

  // ── Openings ───────────────────────────────────────────────────────────────
  const openings = [];
  let opError = '';
  document.querySelectorAll('.opening-item').forEach(el => {
    const id = parseInt(el.id.replace('op-', ''));
    const type = document.querySelector(`input[name="opType${id}"]:checked`)?.value;
    const x1   = ftInEl(`opX${id}Ft`, `opX${id}In`);
    const roW  = ftInEl(`opW${id}Ft`, `opW${id}In`);
    const roH  = ftInEl(`opH${id}Ft`, `opH${id}In`);
    const x2   = x1 + roW;
    const hdrSzKey = document.getElementById(`opHdrSz${id}`)?.value;
    const headerDepth = hdrSzKey === 'custom'
      ? parseFloat(document.getElementById(`opHdrCustom${id}`)?.value) || 0
      : HEADER_DEPTHS[hdrSzKey] || 7.25;
    const headerStyle = document.querySelector(`input[name="opHStyle${id}"]:checked`)?.value;
    // RO heights are measured from the subfloor. Door jacks stand on the bottom plate.
    const rob = type === 'window' ? ftInEl(`opSill${id}Ft`, `opSill${id}In`) : 0;

    if (roW <= 0 || roH <= 0) { opError ||= `Opening ${id} needs a valid width and height.`; return; }
    if (x1 - 3 < 1.5 - 1e-6 || x2 + 3 > wallLen - 1.5 + 1e-6)
      { opError ||= `Opening ${id} is too close to the end of the wall (needs 4½" for end stud, king and jack).`; return; }
    if (type === 'window' && rob < 2 * BP)
      { opError ||= `Opening ${id}: sill height must be at least 3" (bottom plate + sill).`; return; }

    const hx1 = x1 - 1.5, hx2 = x2 + 1.5; // header bears on the jacks
    const roTop = rob + roH;
    let hb, ht;
    if (headerStyle === 'level') {
      hb = flat(roTop); ht = flat(roTop + headerDepth);
    } else {
      if (wallType === 'gable' && hx1 < peakX && hx2 > peakX)
        { opError ||= `Opening ${id}: a raked header can't cross the peak — use a level header.`; return; }
      const m = slopeAt((hx1 + hx2) / 2, params);
      hb = sloped(roTop, x1, m);
      ht = sloped(roTop + headerDepth * Math.hypot(1, m), x1, m);
    }
    if (Math.min(hb.f(hx1), hb.f(hx2)) < BP + 1)
      { opError ||= `Opening ${id}: RO is too short.`; return; }
    if (Math.max(ht.f(hx1), ht.f(hx2)) > minUnder(hx1, hx2) + 1e-6)
      { opError ||= `Opening ${id}: header runs into the top plate. Lower the opening or use a smaller header.`; return; }

    openings.push({ id, type, x1, x2, roW, roH, rob, headerDepth, headerStyle, hdrSzKey, hx1, hx2, hb, ht });
  });
  if (opError) return fail(opError);

  openings.sort((a, b) => a.x1 - b.x1);
  for (let i = 1; i < openings.length; i++) {
    if (openings[i].x1 - 3 < openings[i-1].x2 + 3 - 1e-6)
      return fail(`Openings ${openings[i-1].id} and ${openings[i].id} overlap (their kings collide).`);
  }

  // ── Fixed members: end studs, peak stud, opening framing ───────────────────
  const members = [];
  members.push(member('End', 0, 1.5, BOT, U));
  members.push(member('End', wallLen - 1.5, wallLen, BOT, U));

  for (const op of openings) {
    const n = `Op ${op.id}`;
    members.push(member('King', op.x1 - 3, op.x1 - 1.5, BOT, U, `${n} (left)`));
    members.push(member('Jack', op.x1 - 1.5, op.x1, BOT, op.hb, `${n} (left)`));
    members.push(member('Jack', op.x2, op.x2 + 1.5, BOT, op.hb, `${n} (right)`));
    members.push(member('King', op.x2 + 1.5, op.x2 + 3, BOT, U, `${n} (right)`));
    const hdr = member('Header', op.hx1, op.hx2, op.hb, op.ht, n);
    hdr.hdrLabel = op.hdrSzKey === 'custom' ? `${op.headerDepth}" deep` : op.hdrSzKey.replace('x', '×');
    members.push(hdr);
    if (op.type === 'window') members.push(member('Sill', op.x1, op.x2, flat(op.rob - BP), flat(op.rob), n));
  }
  const fixed = [...members];

  // Gable: a stud under the peak, where the top plates meet
  if (wallType === 'gable') {
    const pk = { xa: peakX - 0.75, xb: peakX + 0.75 };
    const inOpening = openings.some(op => pk.xb > op.x1 - 3 && pk.xa < op.x2 + 3);
    if (!inOpening && pk.xa > 1.5 && pk.xb < wallLen - 1.5)
      fixed.push(members[members.push(member('Peak', pk.xa, pk.xb, BOT, U, 'under plate joint')) - 1]);
  }

  // ── Layout positions (stud centres): OC grid + sheet joints ────────────────
  const xSet = new Set();
  const round3 = v => Math.round(v * 1000) / 1000;
  if (layoutEnd === 'left') {
    for (let x = studSpacing; x < wallLen - 0.01; x += studSpacing) xSet.add(round3(x));
  } else {
    for (let x = wallLen - studSpacing; x > 0.01; x -= studSpacing) xSet.add(round3(x));
  }
  if (overhang < 48) {
    for (let d = 48 - overhang; d < wallLen; d += 48) {
      const pos = round3(layoutEnd === 'left' ? d : wallLen - d);
      if (pos > 0 && pos < wallLen && ![...xSet].some(x => Math.abs(x - pos) < 0.25)) xSet.add(pos);
    }
  }

  for (const x of [...xSet].sort((a, b) => a - b)) {
    const body = { xa: x - 0.75, xb: x + 0.75 };
    // Over an opening (above the header, between the kings): cripples
    const op = openings.find(o => body.xa >= o.hx1 - 1e-6 && body.xb <= o.hx2 + 1e-6);
    if (op) {
      if (fixed.some(m => m.type === 'Peak' && overlaps(m, body))) continue;
      const up = member('Cripple↑', body.xa, body.xb, op.ht, U, `Op ${op.id}`);
      if (Math.min(...up.pts.map(px => U.f(px) - op.ht.f(px))) > 0.25) members.push(up);
      if (op.type === 'window' && op.rob - 2 * BP > 0.25) {
        // Below the sill, keep the cripple between the jacks
        const c = Math.min(Math.max(x, op.x1 + 0.75), op.x2 - 0.75);
        members.push(member('Cripple↓', c - 0.75, c + 0.75, BOT, flat(op.rob - BP), `Op ${op.id}`));
      }
      continue;
    }
    // Skip a layout stud that would collide with an end, king, jack or peak stud
    if (fixed.some(m => m.type !== 'Header' && m.type !== 'Sill' && overlaps(m, body))) continue;
    members.push(member('Regular', body.xa, body.xb, BOT, U));
  }

  // ── Display position (from layout end) ───────────────────────────────────
  const disp = x => layoutEnd === 'left' ? x : wallLen - x;
  const typeOrder = { 'End': 0, 'Regular': 0, 'Peak': 0, 'King': 1, 'Jack': 2, 'Header': 3, 'Cripple↑': 4, 'Sill': 5, 'Cripple↓': 6 };
  members.sort((a, b) => {
    const pd = disp(a.x) - disp(b.x);
    if (Math.abs(pd) > 0.01) return pd;
    return (typeOrder[a.type] || 0) - (typeOrder[b.type] || 0);
  });

  // ── Summary ──────────────────────────────────────────────────────────────
  const count = t => members.filter(m => t.includes(m.type)).length;
  let summaryHTML = '<dl class="summary-grid">';
  summaryHTML += `<dt>Wall</dt><dd>${toFtIn(wallLen)} long &times; ${toFtIn(lowHt)} low-end height</dd>`;
  if (wallType === 'shed') {
    const hiHt = wallHt(wallLen, params);
    const angle = (Math.atan(pitch / 12) * 180 / Math.PI).toFixed(1);
    summaryHTML += `<dt>Shed</dt><dd>Pitch ${pitch}:12 &mdash; high end ${toFtIn(hiHt)}, stud bevel ${angle}&deg;</dd>`;
  } else {
    const peakHt = wallHt(peakX, params);
    const lAngle = (Math.atan(pitch / 12) * 180 / Math.PI).toFixed(1);
    const rAngle = (Math.atan(rightPitch / 12) * 180 / Math.PI).toFixed(1);
    summaryHTML += `<dt>Gable</dt><dd>Peak at ${toFtIn(peakX)} from left, height ${toFtIn(peakHt)}</dd>`;
    summaryHTML += `<dt>Pitches</dt><dd>Left ${pitch}:12 (${lAngle}&deg;) &mdash; Right ${+rightPitch.toFixed(2)}:12 (${rAngle}&deg;)</dd>`;
  }
  const tpLabel = topPlate === 'double' ? 'Double (3")' : 'Single (1½")';
  const plumb = topPlateThick * Math.hypot(1, pitch / 12);
  summaryHTML += `<dt>Plates</dt><dd>${tpLabel} top (${toFtIn(plumb).replace(/^0' /, '')} plumb on the ${pitch}:12 slope), single (1½") bottom &mdash; ${studSpacing}" OC studs</dd>`;
  summaryHTML += `<dt>Layout</dt><dd>From ${layoutEnd} end, sheathing overhang ${overhang}"</dd>`;
  summaryHTML += `<dt>Studs</dt><dd>${count(['End', 'Regular', 'Peak'])} full + ${count(['King'])} kings + ${count(['Jack'])} jacks + ${count(['Cripple↑', 'Cripple↓'])} cripples</dd>`;
  summaryHTML += '</dl>';

  document.getElementById('summaryContent').innerHTML = summaryHTML;
  document.getElementById('svgContent').innerHTML = generateWallSVG(members, openings, params);
  document.getElementById('layoutFromLabel').textContent = layoutEnd;

  // ── Cut list ─────────────────────────────────────────────────────────────
  const layoutLabel = layoutEnd === 'left' ? 'Left' : 'Right';
  let tbl = `<table class="stud-table"><thead><tr>
    <th>Center from ${layoutLabel}</th><th>Type</th><th>Length</th><th>Notes</th>
  </tr></thead><tbody>`;

  for (const m of members) {
    let lenCell, notes = m.notes;
    if (m.type === 'Header') {
      const m0 = (m.bot.f(m.xb) - m.bot.f(m.xa)) / (m.xb - m.xa);
      lenCell = toFtIn((m.xb - m.xa) * Math.hypot(1, m0));
      notes = `${m.hdrLabel} ${m.notes}${Math.abs(m0) > 1e-9 ? ', plumb cut both ends' : ''}`;
    } else if (m.type === 'Sill') {
      lenCell = toFtIn(m.xb - m.xa);
    } else {
      lenCell = toFtIn(m.length) + (m.cut ? ` <small>${m.cut}</small>` : '');
    }
    tbl += `<tr>
      <td class="pos-col">${toFtIn(disp(m.x))}</td>
      <td>${m.type}</td>
      <td class="len-col">${lenCell}</td>
      <td>${notes}</td>
    </tr>`;
  }
  tbl += '</tbody></table>';
  document.getElementById('studListContent').innerHTML = tbl;

  const resultsEl = document.getElementById('results');
  resultsEl.style.display = 'block';
  resultsEl.scrollIntoView({ behavior: 'smooth' });
}
</script>
